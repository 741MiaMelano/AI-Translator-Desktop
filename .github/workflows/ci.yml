name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Set up pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.10.0
          run_install: false
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned Qwen sidecar test dependency
        run: python -m pip install --disable-pip-version-check --no-input numpy==2.4.6
      - name: Check source, contracts, tests, and production build
        run: pnpm run check
      - name: Build Windows installer and portable release
        run: pnpm run package:ci
        env:
          PHASE7_ASR_ALLOW_DOWNLOAD: "1"
